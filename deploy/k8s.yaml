apiVersion: apps/v1
kind: Deployment
metadata: { name: ewcorr, labels: { app: ewcorr } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ewcorr } }
  template:
    metadata: { labels: { app: ewcorr } }
    spec:
      containers:
        - name: ewcorr
          image: ghcr.io/cognis-digital/ewcorr:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: ewcorr }
spec:
  selector: { app: ewcorr }
  ports: [{ port: 80, targetPort: 8000 }]
